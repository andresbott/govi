version: "2"
linters:
  default: standard # errcheck,govet,ineffassign,staticcheck,unused
  enable:
    - nolintlint
    - gocyclo
    - nestif
    - gosec
    - dupl

  # exclude noisy linters on test files: structural checks plus gosec, whose
  # G304 fires on tests that read temp files they just wrote under t.TempDir().
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - nestif
          - dupl
          - gosec
      # zarf/macos is the build-time macOS packager (not shipped, not exposed to
      # untrusted input: its paths come from goreleaser and the repo). gosec's
      # file rules are wrong for it by construction — a .app must contain
      # world-readable 0644 files, 0755 directories and a 0755 executable, so
      # G301/G306 would demand modes that make the bundle unusable, and
      # G304/G703/G122 flag reading and copying the very paths the tool is asked
      # to package.
      - path: 'zarf/macos/'
        linters:
          - gosec

  settings:
    nolintlint:
      # Enable to require an explanation of nonzero length after each nolint directive.
      require-explanation: true
      # Enable to require nolint directives to mention the specific linter being suppressed.
      require-specific: true
    gocyclo:
      min-complexity: 20  # Default: 30 (but we recommend 10-20)
    nestif:
      min-complexity: 5   # Default: 5

output:
  sort-order:
    - file
    - severity
    - linter
