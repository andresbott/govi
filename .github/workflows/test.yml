name: test
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install cgo build dependencies (libmpv, GLFW/X11 headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv-dev libgl1-mesa-dev xorg-dev

      - name: run tests
        run: make test

      - name: ensure test coverage
        run: make coverage
