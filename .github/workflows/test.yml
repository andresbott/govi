name: test
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install cgo build dependencies (libmpv, GLFW/X11 headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv-dev libgl1-mesa-dev xorg-dev

      - name: run tests
        run: make test

      - name: ensure test coverage
        run: make coverage

  # compile + cgo-link check only. This is what catches a broken darwin build
  # before a tag is pushed, since the release path can't be rehearsed locally.
  # It deliberately does NOT run `make test`: the headless-mpv and Gio
  # measurement tests need a display/font environment on macOS, which is
  # separate work (docs/agents/testing.md). The linux `test` job above remains
  # the functional gate.
  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install cgo build dependencies (libmpv via mpv, pkg-config)
        run: brew install mpv pkgconf

      - name: build darwin snapshot
        # goreleaser is NOT preinstalled on the macOS runner images, so it comes
        # from the action here — same as the release workflow, which also keeps
        # both jobs on the same major version.
        # exercises the full compile and cgo-link path against Homebrew's libmpv.
        # NOT --single-target: that matches the *host* target, so it would exit
        # 0 having built nothing if the runner arch ever mismatched.
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean --config .goreleaser.darwin.yaml

      - name: Show the resulting libmpv linkage
        # also guards against a vacuous build: no binary means failure.
        run: |
          bin=$(find dist -name govi -type f | head -1)
          test -n "$bin" || { echo "no darwin binary was produced"; exit 1; }
          otool -L "$bin"

      - name: Check the .app bundle and the disk image
        # The post-build hook (zarf/macos) assembles govi.app and the .dmg. Only
        # a macOS runner can check the parts that matter here: that plutil — the
        # same parser Launch Services uses — accepts the generated Info.plist,
        # and that hdiutil produced a mountable image. A malformed plist makes
        # macOS ignore the bundle silently, with no error the user ever sees.
        run: |
          app=$(find dist -name 'govi.app' -type d | head -1)
          test -n "$app" || { echo "no govi.app was produced"; exit 1; }
          plutil -lint "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/govi.icns" || { echo "the bundle has no icon"; exit 1; }
          test -x "$app/Contents/MacOS/govi" || { echo "the bundled binary is not executable"; exit 1; }

          # The minimum-OS claim the binary itself carries. bundle.VerifyMinOS
          # (in the post-build hook) already fails the build when this disagrees
          # with LSMinimumSystemVersion; printing it here puts the real number in
          # every PR log, which is what would have caught v0.1.5 shipping a
          # binary stamped with the runner's macOS 26 and unopenable from Finder.
          vtool -show-build-version "$app/Contents/MacOS/govi" | grep -A2 'platform'

          dmg=$(find dist -name '*.dmg' | head -1)
          test -n "$dmg" || { echo "no .dmg was produced"; exit 1; }
          hdiutil imageinfo "$dmg" > /dev/null || { echo "the .dmg is not a readable image"; exit 1; }
          echo "bundle and image OK: $app / $dmg"
